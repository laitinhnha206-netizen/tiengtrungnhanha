<section id="test" class=""><div class="title"><div><h2>🎯 Kiểm tra</h2></div></div><div id="testContent"></div></section><section id="writing" class=""><div class="title"><div><h2>✍️ Luyện viết</h2></div></div><div id="writingContent"></div></section><section id="quick" class=""><div class="title"><div><h2>📌 Ôn nhanh</h2></div></div><div id="quickContent"></div></section><script>const D={"vocab": [{"l": 7, "h": "现在", "v": "bây giờ", "p": "xiàn zài"}, {"l": 7, "h": "点", "v": "giờ", "p": "diǎn"}, {"l": 7, "h": "早上", "v": "sáng sớm", "p": "zǎoshang"}, {"l": 7, "h": "上午", "v": "buổi sáng", "p": "shàng wǔ"}, {"l": 7, "h": "分", "v": "phút", "p": "fēn"}, {"l": 7, "h": "课", "v": "tiết học, môn học", "p": "kè"}, {"l": 7, "h": "下午", "v": "buổi chiều", "p": "xià wǔ"}, {"l": 7, "h": "见", "v": "gặp", "p": "jiàn"}, {"l": 7, "h": "吧", "v": "nhé, đi (gợi ý)", "p": "ba"}, {"l": 7, "h": "电影院", "v": "rạp chiếu phim", "p": "diàn yǐng yuàn"}, {"l": 7, "h": "看", "v": "xem, nhìn", "p": "kàn"}, {"l": 7, "h": "电影", "v": "phim", "p": "diàn yǐng"}, {"l": 7, "h": "事", "v": "việc", "p": "shì"}, {"l": 7, "h": "上课", "v": "vào học", "p": "shàng kè"}, {"l": 7, "h": "呢", "v": "trợ từ ngữ khí", "p": "ne"}, {"l": 7, "h": "半", "v": "nửa", "p": "bàn"}, {"l": 7, "h": "下课", "v": "tan học", "p": "xià kè"}, {"l": 7, "h": "在", "v": "ở, tại", "p": "zài"}, {"l": 7, "h": "家", "v": "nhà", "p": "jiā"}, {"l": 7, "h": "里", "v": "trong", "p": "li / lǐ"}, {"l": 7, "h": "晚上", "v": "buổi tối", "p": "wǎnshang"}, {"l": 7, "h": "医院", "v": "bệnh viện", "p": "yī yuàn"}, {"l": 7, "h": "上班", "v": "đi làm", "p": "shàng bān"}, {"l": 7, "h": "店", "v": "cửa hàng", "p": "diàn"}, {"l": 7, "h": "菜", "v": "rau, món ăn", "p": "cài"}, {"l": 7, "h": "分钟", "v": "phút (khoảng thời gian)", "p": "fēn zhōng"}, {"l": 7, "h": "后", "v": "sau", "p": "hòu"}, {"l": 7, "h": "下班", "v": "tan làm", "p": "xià bān"}, {"l": 8, "h": "房间", "v": "phòng", "p": "fáng jiān"}, {"l": 8, "h": "外", "v": "ngoài", "p": "wài"}, {"l": 8, "h": "只", "v": "lượng từ cho con vật", "p": "zhī"}, {"l": 8, "h": "小", "v": "nhỏ", "p": "xiǎo"}, {"l": 8, "h": "猫", "v": "mèo", "p": "māo"}, {"l": 8, "h": "没", "v": "không, chưa", "p": "méi"}, {"l": 8, "h": "看见", "v": "nhìn thấy", "p": "kànjiàn"}, {"l": 8, "h": "桌子", "v": "bàn", "p": "zhuōzi"}, {"l": 8, "h": "下", "v": "dưới", "p": "xià"}, {"l": 8, "h": "漂亮", "v": "đẹp", "p": "piàoliang"}, {"l": 8, "h": "在", "v": "ở, tại", "p": "zài"}, {"l": 8, "h": "学校", "v": "trường học", "p": "xué xiào"}, {"l": 8, "h": "书店", "v": "hiệu sách", "p": "shū diàn"}, {"l": 8, "h": "前", "v": "trước", "p": "qián"}, {"l": 8, "h": "能", "v": "có thể", "p": "néng"}, {"l": 8, "h": "到", "v": "đến", "p": "dào"}, {"l": 8, "h": "午饭", "v": "bữa trưa", "p": "wǔ fàn"}, {"l": 8, "h": "饭", "v": "cơm, bữa ăn", "p": "fàn"}, {"l": 8, "h": "大", "v": "lớn", "p": "dà"}, {"l": 8, "h": "医生", "v": "bác sĩ", "p": "yī shēng"}, {"l": 8, "h": "多", "v": "nhiều", "p": "duō"}, {"l": 8, "h": "病人", "v": "bệnh nhân", "p": "bìng rén"}, {"l": 8, "h": "工作", "v": "làm việc, công việc", "p": "gōng zuò"}, {"l": 9, "h": "前边", "v": "phía trước", "p": "qiánbian"}, {"l": 9, "h": "边", "v": "bên, phía", "p": "bian / biān"}, {"l": 9, "h": "家", "v": "lượng từ cho cửa hàng, cơ sở", "p": "jiā"}, {"l": 9, "h": "那个", "v": "cái đó", "p": "nàge"}, {"l": 9, "h": "外边", "v": "bên ngoài", "p": "wàibian"}, {"l": 9, "h": "椅子", "v": "ghế", "p": "yǐzi"}, {"l": 9, "h": "上", "v": "trên", "p": "shang / shàng"}, {"l": 9, "h": "本", "v": "lượng từ cho sách", "p": "běn"}, {"l": 9, "h": "书", "v": "sách", "p": "shū"}, {"l": 9, "h": "那", "v": "đó, kia", "p": "nà"}, {"l": 9, "h": "第", "v": "thứ (số thứ tự)", "p": "dì"}, {"l": 9, "h": "学习", "v": "học tập", "p": "xué xí"}, {"l": 9, "h": "做", "v": "làm", "p": "zuò"}, {"l": 9, "h": "白天", "v": "ban ngày", "p": "bái tiān"}, {"l": 9, "h": "读书", "v": "đọc sách", "p": "dú shū"}, {"l": 9, "h": "和", "v": "và, với", "p": "hé"}, {"l": 9, "h": "朋友", "v": "bạn bè", "p": "péngyou"}, {"l": 9, "h": "唱", "v": "hát", "p": "chàng"}, {"l": 9, "h": "歌", "v": "bài hát", "p": "gē"}, {"l": 9, "h": "好听", "v": "hay (âm thanh)", "p": "hǎo tīng"}, {"l": 9, "h": "电视", "v": "tivi", "p": "diàn shì"}, {"l": 9, "h": "狗", "v": "chó", "p": "gǒu"}, {"l": 9, "h": "玩", "v": "chơi", "p": "wán"}], "grammar": [[7, "Nói giờ và thời lượng", "点 dùng cho giờ; 分 dùng cho phút trên đồng hồ. 分钟 nói một khoảng thời gian. Dùng 两点 cho 2 giờ; 半 là 30 phút.", "Buổi + số giờ + 点 + số phút + 分 / số + 分钟", [["现在几点？", "Bây giờ mấy giờ?"], ["下午两点半。", "Hai giờ rưỡi chiều."], ["我们十分钟后见吧。", "Mười phút nữa chúng ta gặp nhau nhé."]]], [7, "Thời gian và phó từ làm trạng ngữ", "Trạng ngữ bổ sung thời gian, mức độ hoặc phủ định; thường đứng trước động từ/tính từ. Thời gian cũng có thể đứng đầu câu.", "S + thời gian / phó từ + V / tính từ", [["我明天上课。", "Ngày mai tôi đi học."], ["我们都喜欢喝茶。", "Chúng tôi đều thích uống trà."], ["我现在不在家。", "Bây giờ tôi không ở nhà."]]], [7, "吧 — gợi ý nhẹ nhàng", "Thêm 吧 ở cuối câu để đề nghị hoặc rủ ai đó làm gì. Đọc nhẹ: ba.", "Câu đề nghị + 吧", [["我们下午两点见吧。", "Chúng ta gặp nhau lúc hai giờ chiều nhé."], ["我们去看电影吧。", "Chúng ta đi xem phim nhé."]]], [7, "呢 — tiếp nối câu hỏi, nhấn mạnh tình trạng", "A 呢？ hỏi tiếp về A khi đã có ngữ cảnh. Với tình trạng đang diễn ra, 呢 làm giọng nói tự nhiên hơn; không phải cứ có 呢 là thì tiếp diễn.", "A + 呢？ / câu nói về tình trạng + 呢", [["我在家，你呢？", "Tôi ở nhà, còn bạn?"], ["我现在有事呢。", "Bây giờ tôi đang có việc."]]], [8, "Từ phương vị", "Đặt từ chỉ vị trí sau danh từ: bàn + dưới → 桌子下. 前边/后边 giúp diễn đạt rõ phía trước/sau; dùng được với người và vật.", "Danh từ + 上 / 下 / 里 / 外 / 前边 / 后边", [["小猫在桌子下。", "Mèo con ở dưới bàn."], ["他在房间外。", "Anh ấy ở ngoài phòng."], ["学校前边有一家书店。", "Phía trước trường có một hiệu sách."]]], [8, "在 — ở đâu, làm gì ở đâu", "在 + nơi chốn có thể là vị ngữ để nói ở đâu. Nếu có hành động, đặt cả cụm 在 + nơi chốn trước động từ.", "S + 在 + nơi chốn (+ V + O)", [["我在学校。", "Tôi ở trường."], ["我在学校吃午饭。", "Tôi ăn trưa ở trường."], ["爸爸在医院工作。", "Bố làm việc ở bệnh viện."]]], [8, "能 — có thể", "能 đứng trước động từ, nói có khả năng hoặc điều kiện làm việc gì. Phủ định dùng 不能; câu hỏi dùng 能……吗？", "S + 能 / 不能 + V", [["你几点能到学校？", "Mấy giờ bạn có thể đến trường?"], ["我下午两点能到。", "Tôi có thể đến lúc hai giờ chiều."], ["我现在有事，不能去。", "Bây giờ tôi có việc, không thể đi."]]], [8, "没 / 没有", "Phủ định 有 dùng 没有. Phủ định việc nhìn thấy dùng 没看见. Không dùng 不有.", "没有 + danh từ / 没 + động từ", [["我没有猫。", "Tôi không có mèo."], ["我没看见小猫。", "Tôi không nhìn thấy mèo con."]]], [9, "Câu tồn tại với 有", "Bắt đầu bằng nơi chốn, rồi nói ở đó có gì. Phủ định dùng 没有. Không thêm 在 vào đầu mẫu câu này.", "Nơi chốn + 有 / 没有 + số lượng + danh từ", [["椅子上有一本书。", "Trên ghế có một quyển sách."], ["桌子下没有小猫。", "Dưới bàn không có mèo con."], ["学校前边有一家电影院。", "Phía trước trường có một rạp chiếu phim."]]], [9, "Thời gian + địa điểm", "Khi cả hai cùng làm trạng ngữ, đặt thời gian trước địa điểm. Cụm địa điểm thường bắt đầu bằng 在.", "S + thời gian + 在 + nơi chốn + V + O", [["我明天上午在学校学习。", "Sáng mai tôi học ở trường."], ["我们晚上在家里看电视。", "Buổi tối chúng tôi xem tivi ở nhà."], ["我们七点在电影院外边见。", "Chúng ta gặp nhau lúc bảy giờ ở ngoài rạp phim."]]], [9, "第 — số thứ tự", "第 đứng trước số. Khi chỉ một đồ vật cụ thể, thêm lượng từ và danh từ. Phân biệt 两本书 (hai quyển sách) với 第二本书 (quyển sách thứ hai).", "第 + số (+ lượng từ + danh từ)", [["这是我的第二本中文书。", "Đây là quyển sách tiếng Trung thứ hai của tôi."], ["他是第一个学生。", "Anh ấy là học sinh đầu tiên."]]], [9, "Lượng từ 只、本、家", "只 dùng cho mèo/chó; 本 cho sách; 家 cho cửa hàng/cơ sở. 家 còn có nghĩa là nhà khi dùng như danh từ.", "Số + lượng từ + danh từ", [["两只小狗", "Hai con chó nhỏ."], ["三本书", "Ba quyển sách."], ["一家书店", "Một hiệu sách."]]]], "speak": [[7, "Hỏi giờ", "Hỏi giờ hiện tại và trả lời; dùng 点、分、半.", "现在几点？现在下午两点半。"], [7, "Lịch học", "Nói giờ vào học, tan học và hẹn gặp.", "我上午八点上课，中午十二点下课。我们下午两点见吧。"], [7, "Giờ đi làm", "Hỏi và trả lời giờ đi làm, tan làm.", "你几点上班？我早上八点上班，晚上六点半下班。"], [7, "Rủ đi xem phim", "Rủ bạn đi xem phim, thống nhất thời g
