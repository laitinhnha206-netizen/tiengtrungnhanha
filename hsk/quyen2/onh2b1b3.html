<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ôn tập Bài 1–3</title><style>
:root{--b:#2563eb;--b2:#eff6ff;--g:#15803d;--r:#dc2626;--ink:#172033;--m:#667085;--bg:#f7f9fc;--line:#dde5ef;--shadow:0 10px 28px rgba(24,55,94,.1)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Arial,sans-serif;padding-bottom:70px}.cn{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
header{padding:28px 16px;text-align:center;color:#fff;background:linear-gradient(135deg,#6d3df2,#2f63dc 55%,#159468);border-radius:0 0 28px 28px}.badge{display:inline-block;background:#fde68a;color:#513600;border-radius:999px;padding:5px 12px;font-weight:900;font-size:12px}h1{font-size:clamp(30px,6vw,50px);margin:8px 0 2px}.sub{margin:0}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}.controls button,.controls select{border:0;border-radius:12px;padding:10px 12px;font-weight:850}
.tabs{position:sticky;top:0;z-index:100;display:flex;gap:7px;overflow-x:auto;white-space:nowrap;background:#fff;padding:9px;border-bottom:1px solid var(--line)}.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:850}.tabs button.active{background:var(--b);color:#fff}
section{display:none;max-width:1080px;margin:auto;padding:22px 14px 36px}section.active{display:block}.title{display:flex;gap:10px;align-items:center;margin-bottom:14px}.icon{width:46px;height:46px;border-radius:14px;background:var(--b);color:#fff;display:grid;place-items:center;font-size:22px}.title h2{margin:0}.title p{margin:0;color:var(--m);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:15px}.tag{display:inline-block;border-radius:999px;padding:3px 8px;background:var(--b2);color:#1d4ed8;font-size:12px;font-weight:850}.han{font-size:29px;font-weight:900}.py{color:var(--r);font-style:italic;font-size:14px}.hide-pinyin .py{display:none!important}
.formula{background:#ecfdf3;border:1px dashed #86cda1;border-radius:12px;padding:9px 11px;font-weight:900}.hint{background:#fff8da;border-left:5px solid #f59e0b;padding:10px 12px}.btn,.audio,.ghost,.subtab{border:0;border-radius:12px;padding:10px 12px;font-weight:850;cursor:pointer}.btn{background:var(--g);color:#fff}.audio{background:var(--b2);color:#174ea6}.ghost,.subtab{background:#fff;border:1px solid var(--line)}.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.subtab.active{background:var(--b);color:#fff}

.speak-step{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin:7px 0}.builder-bank,.builder-answer{display:flex;gap:8px;flex-wrap:wrap;min-height:58px;padding:10px;border:2px dashed #b8c6d8;border-radius:13px;background:#f8fafc;margin:10px 0}.builder-chip{border:1px solid #b8c6d8;border-radius:999px;background:#fff;padding:9px 12px;font-weight:900}
.component-formula{font-size:32px;font-weight:950;text-align:center;background:#f8fafc;border:2px dashed #b8c6d8;border-radius:15px;padding:15px;margin:12px 0}.component-options{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.component-option{padding:14px;border:2px solid var(--line);border-radius:13px;background:#fff;font-size:26px;font-weight:900}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory-card{min-height:76px;border:2px solid var(--line);border-radius:13px;background:#fff;font-weight:900;padding:8px;display:grid;place-items:center;text-align:center}.memory-card.flipped{background:var(--b2)}.memory-card.matched{background:#e7f8e7;border-color:#19853a}
.fold-hint{margin-top:12px}.fold-hint summary{cursor:pointer;font-weight:900;list-style:none}.fold-hint summary::-webkit-details-marker{display:none}.fold-hint summary::after{content:'＋';float:right;font-size:20px}.fold-hint[open] summary::after{content:'−'}.hint-content{margin-top:10px}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}.opt,.component-option,.memory-card,.builder-chip{pointer-events:auto;cursor:pointer}.opts,.builder-bank,.builder-answer{position:relative;z-index:4}

header{padding:20px 16px}h1{font-size:clamp(26px,5vw,38px)}.cn{font-size:24px;line-height:1.65;font-weight:600}.han{font-size:30px}.py{font-size:16px}.opt .cn{font-size:24px}.tag{font-size:14px}.status{padding:12px;background:#eff6ff;border-radius:12px;margin-bottom:14px}input{font:inherit;border:2px solid var(--line);border-radius:10px;padding:10px;max-width:100%}.answerinput{width:100%}.selected{border-color:var(--b);background:var(--b2)}.score{font-size:22px;font-weight:900}.builder-chip .cn{font-size:24px}.memory-card .cn{font-size:24px}.memory-card{min-height:110px}.round{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.opt{font:inherit}.feedback{padding-top:8px}.error{color:var(--r)}button:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}.reading{font-size:24px;line-height:2}.card h3{margin-top:8px}.writebox{display:block;width:300px;max-width:100%;height:300px;background:#fff;border:2px solid #b8c6d8;touch-action:none}.readprompt{margin-top:18px}
.stroke-box{width:280px;height:280px;touch-action:none;background-color:white;background-image:linear-gradient(to right,transparent 49.7%,#cdd7e2 49.7%,#cdd7e2 50.3%,transparent 50.3%),linear-gradient(to bottom,transparent 49.7%,#cdd7e2 49.7%,#cdd7e2 50.3%,transparent 50.3%);border:2px solid #b8c6d8;box-sizing:content-box}#wordSelect{font:inherit;max-width:100%;padding:10px;border-radius:10px}#wordResult .cn{font-size:30px}.dictation-feedback{line-height:1.8}</style></head><body><header><span class="badge">BÀI 1–3</span><h1 class="cn">第一课 — 第三课 复习</h1><p class="sub">Du lịch · Phương tiện · Kết quả hành động</p><div class="controls"><button id="pinyinBtn">🙈 Ẩn pinyin</button><button id="testVoice">🔊 Thử âm thanh</button><select id="voiceSelect" aria-label="Giọng đọc tiếng Trung"></select></div><p id="audioStatus" style="margin:8px 0 0;font-size:14px"></p></header><nav class="tabs" aria-label="Các phần ôn tập"><button data-tab="home" class="active">🏠 Tổng quan</button><button data-tab="study" class="">📚 Học bài</button><button data-tab="speak" class="">🗣️ Luyện nói</button><button data-tab="practice" class="">🎧 Nghe & Điền</button><button data-tab="games" class="">🎮 Trò chơi</button><button data-tab="test" class="">🎯 Kiểm tra</button><button data-tab="writing" class="">✍️ Luyện viết</button><button data-tab="quick" class="">📌 Ôn nhanh</button></nav><section id="home" class="active"><div class="title"><div><h2>🏠 Tổng quan</h2></div></div><div id="homeContent"></div></section><section id="study" class=""><div class="title"><div><h2>📚 Học bài</h2></div></div><div id="studyContent"></div></section><section id="speak" class=""><div class="title"><div><h2>🗣️ Luyện nói</h2></div></div><div id="speakContent"></div></section><section id="practice" class=""><div class="title"><div><h2>🎧 Nghe & Điền</h2></div></div><div id="practiceContent"></div></section><section id="games" class=""><div class="title"><div><h2>🎮 Trò chơi</h2></div></div><div id="gamesContent"></div></section><section id="test" class=""><div class="title"><div><h2>🎯 Kiểm tra</h2></div></div><div id="testContent"></div></section><section id="writing" class=""><div class="title"><div><h2>✍️ Luyện viết</h2></div></div><div id="writingContent"></div></section><section id="quick" class=""><div class="title"><div><h2>📌 Ôn nhanh</h2></div></div><div id="quickContent"></div></section><script>const D={"vocab":[{"l":1,"h":"就","v":"chính, ngay","p":"jiù"},{"l":1,"h":"给","v":"cho","p":"gěi"},{"l":1,"h":"让","v":"bảo, để","p":"ràng"},{"l":1,"h":"接","v":"đón","p":"jiē"},{"l":1,"h":"次","v":"lần","p":"cì"},{"l":1,"h":"旅游","v":"du lịch","p":"lǚ yóu"},{"l":1,"h":"帮忙","v":"giúp đỡ","p":"bāngmáng"},{"l":1,"h":"不好意思","v":"ngại quá, xin lỗi","p":"bù hǎo yìsi"},{"l":1,"h":"已经","v":"đã","p":"yǐ jīng"},{"l":1,"h":"那","v":"vậy thì","p":"nà"},{"l":1,"h":"介绍","v":"giới thiệu","p":"jièshào"},{"l":1,"h":"有时","v":"đôi khi","p":"yǒu shí"},{"l":1,"h":"懂","v":"hiểu","p":"dǒng"},{"l":1,"h":"意思","v":"ý, nghĩa","p":"yìsi"},{"l":1,"h":"北京烤鸭","v":"vịt quay Bắc Kinh","p":"běi jīng kǎo yā"},{"l":2,"h":"公交车","v":"xe buýt","p":"gōng jiāo chē"},{"l":2,"h":"但","v":"nhưng","p":"dàn"},{"l":2,"h":"车站","v":"bến xe, trạm xe","p":"chē zhàn"},{"l":2,"h":"远","v":"xa","p":"yuǎn"},{"l":2,"h":"打车","v":"đi taxi, gọi taxi","p":"dǎ chē"},{"l":2,"h":"还是","v":"hay là, vẫn nên","p":"háishi"},{"l":2,"h":"啊","v":"trợ từ cảm thán","p":"a"},{"l":2,"h":"万","v":"vạn (10.000)","p":"wàn"},{"l":2,"h":"名","v":"lượng từ cho người","p":"míng"},{"l":2,"h":"网上","v":"trên mạng","p":"wǎng shàng"},{"l":2,"h":"外国","v":"nước ngoài","p":"wài guó"},{"l":2,"h":"间","v":"lượng từ cho phòng","p":"jiān"},{"l":2,"h":"教室","v":"phòng học","p":"jiào shì"},{"l":2,"h":"票","v":"vé","p":"piào"},{"l":2,"h":"别","v":"đừng","p":"bié"},{"l":2,"h":"过来","v":"qua đây","p":"guòlái"},{"l":2,"h":"北京大学","v":"Đại học Bắc Kinh","p":"běi jīng dà xué"},{"l":3,"h":"回来","v":"trở lại","p":"huílái"},{"l":3,"h":"这么","v":"như thế, đến vậy","p":"zhème"},{"l":3,"h":"完","v":"xong","p":"wán"},{"l":3,"h":"一起","v":"cùng nhau","p":"yìqǐ"},{"l":3,"h":"出去","v":"ra ngoài","p":"chūqù"},{"l":3,"h":"洗","v":"rửa, giặt","p":"xǐ"},{"l":3,"h":"自己","v":"tự mình","p":"zìjǐ"},{"l":3,"h":"拿","v":"lấy, cầm","p":"ná"},{"l":3,"h":"手","v":"tay","p":"shǒu"},{"l":3,"h":"为什么","v":"tại sao","p":"wèi shén me"},{"l":3,"h":"不错","v":"không tệ, khá tốt","p":"búcuò"},{"l":3,"h":"送","v":"đưa, tiễn, tặng","p":"sòng"},{"l":3,"h":"回去","v":"trở về","p":"huíqù"},{"l":3,"h":"每","v":"mỗi","p":"měi"},{"l":3,"h":"累","v":"mệt","p":"lèi"}],"grammar":[[1,"吧 — phỏng đoán","Trong bài này, 吧 cuối câu dùng khi người nói đoán một điều và muốn xác nhận: “...đúng không/nhỉ?”. Khác cách rủ rê đã học.","Câu phỏng đoán + 吧？",[["你就是王老师的学生吧？","Bạn chính là học sinh của cô Vương, đúng không?"],["他是中国人吧？","Anh ấy là người Trung Quốc, phải không?"]]],[1,"是……的 — nhấn mạnh chi tiết","Nhấn mạnh thời gian, địa điểm, cách thức hoặc người thực hiện khi hành động đã xảy ra/được biết. 是 có thể lược bỏ trong câu khẳng định và câu hỏi; phủ định giữ 不是. Bài còn dùng 我们是来旅游的 để làm rõ mục đích chuyến đi.","S + 是 + chi tiết + V + 的 / S + 不是 + chi tiết + V + 的",[["我是今天早上到的。","Tôi đến vào sáng nay."],["我们不是坐出租车来的。","Chúng tôi không đến bằng taxi."],["我们是来旅游的。","Chúng tôi đến để du lịch."]]],[1,"Câu kiêm ngữ: 请、让、叫","Người đứng sau 请/让/叫 là người làm hành động phía sau. Nhớ: ai bảo/mời → bảo/mời ai → làm gì. 请 thường lịch sự; 让、叫 có thể là bảo/yêu cầu.","S + 请 / 让 / 叫 + người + V (+ O)",[["我想请你帮个忙。","Tôi muốn nhờ bạn giúp một việc."],["王老师让我们说中文。","Cô Vương bảo chúng tôi nói tiếng Trung."],["妈妈叫孩子们回家。","Mẹ gọi/bảo các con về nhà."]]],[1,"已经 — đã","已经 đứng trước động từ, thường kết hợp 了 để nói việc đã xảy ra hoặc trạng thái đã hình thành. Không nhất thiết câu nào cũng thêm 了.","S + 已经 + V (+ O) + 了",[["我已经到北京了。","Tôi đã đến Bắc Kinh rồi."],["这已经是我第三次来北京了。","Đây đã là lần thứ ba tôi đến Bắc Kinh."]]],[2,"还是……吧 — đề nghị chọn cách tốt hơn","Dùng khi cân nhắc rồi nghiêng về một phương án: “hay là/vẫn nên ... đi”. Khác câu hỏi chọn lựa A 还是 B？","S + 还是 + V (+ O) + 吧",[["我们还是打车去吧。","Hay là chúng ta đi taxi đi."],["还是别看电影了。","Hay là đừng xem phim nữa."]]],[2,"多 — số lượng hơn một chút","Sau số tròn chục/trăm/nghìn..., 多 thường đứng trước lượng từ. Với lượng từ chia nhỏ được (tiền, thời gian...), 多 có thể đứng sau lượng từ để nói phần lẻ. Không dùng 三个多学生 để nói hơn ba học sinh.","Số tròn + 多 + lượng từ + N / số + đơn vị chia nhỏ + 多",[["二十多个学生","Hơn hai mươi học sinh."],["三千多名外国学生","Hơn ba nghìn sinh viên nước ngoài."],["五块多钱","Hơn năm tệ (có phần lẻ)."]]],[2,"Định ngữ + 的 + danh từ","Phần mô tả đứng trước 的; danh từ chính đứng sau. Cụm động từ hoặc cụm chủ–vị có thể làm định ngữ. Xác định “ai/cái gì” trước, rồi ghép phần mô tả.","V / cụm V / cụm S–V + 的 + danh từ",[["他们卖的电影票很便宜。","Vé phim họ bán rất rẻ."],["这是朋友给我的杯子。","Đây là chiếc cốc bạn cho tôi."],["学中文的学生很多。","Có nhiều học sinh học tiếng Trung."]]],[2,"别 — đừng","别 đặt trước động từ để khuyên/yêu cầu đừng làm. 别……了 thường dùng khi khuyên dừng việc đó hoặc thay đổi dự định.","别 + V (+ O) (+ 了)",[["别买了。","Đừng mua nữa."],["他在学习，别去找他玩了。","Anh ấy đang học, đừng đến rủ anh ấy chơi nữa."]]],[3,"Bổ ngữ kết quả: 完、好、晚","Bổ ngữ đứng ngay sau động từ, nói kết quả. 完 nhấn mạnh làm hết/xong; 好 nhấn mạnh chuẩn bị/hoàn tất, sẵn sàng; 晚 là muộn. 做好 và 做得好 khác nhau.","V + bổ ngữ kết quả + (O) + 了",[["我做完作业了。","Tôi làm xong bài tập rồi."],["菜都做好了。","Các món đều nấu xong rồi."],["他今天来晚了。","Hôm nay anh ấy đến muộn."]]],[3,"Phủ định và hỏi kết quả","Kết quả chưa đạt: dùng 没(有) trước cụm V + kết quả, bỏ 了 cuối câu. Có thể hỏi bằng 了吗、没有 hoặc V + 没 + V + kết quả.","没 + V + kết quả / V + kết quả + 了吗？",[["我还没想好呢。","Tôi vẫn chưa quyết định xong."],["你吃完饭了吗？","Bạn ăn cơm xong chưa?"],["你想没想好？","Bạn đã quyết định xong chưa?"]]],[3,"Lặp động từ — làm một chút/thử","Động từ một âm tiết: AA hoặc A一A; hai âm tiết: ABAB; từ ly hợp thường AAB. Dùng để diễn tả ngắn, thử làm, giọng nhẹ nhàng. Không lặp máy móc mọi động từ.","AA / A一A / ABAB / AAB",[["你再想一想。","Bạn nghĩ thêm một chút."],["我想休息休息。","Tôi muốn nghỉ một chút."],["你能帮帮忙吗？","Bạn giúp một chút được không?"]]],[3,"Lặp động từ — hành động đã xảy ra","Trong các mẫu bài này: một âm tiết A了A; hai âm tiết dùng AB了一下; ly hợp dùng A了AB.","A了A / AB了一下 / A了AB",[["我看了看网上的介绍。","Tôi đã xem qua giới thiệu trên mạng."],["我休息了一下。","Tôi đã nghỉ một chút."],["他昨天来帮了帮忙。","Hôm qua anh ấy đến giúp một chút."]]]],"speak":[[1,"Đón bạn đến Bắc Kinh","Hỏi bạn lần đầu đến không, đến lúc nào và ai đón.","你是第一次来北京吗？你是什么时候到的？是谁来接你的？"],[1,"Mục đích chuyến đi","Hỏi đến để học hay du lịch; dùng 是……的.","你是来学中文的吗？不是，我是来旅游的。"],[1,"Nhờ giúp đỡ","Nhờ bạn giúp một việc, đồng ý hoặc từ chối lịch sự.","我想请你帮个忙。不好意思，我现在有事，你可以叫李文帮忙。"],[1,"Giới thiệu một người","Giới thiệu bạn, nói lời chào và hỏi xác nhận bằng 吧.","我给你介绍一下，这是安妮。你就是王老师的学生吧？"],[2,"Hỏi đường và phương tiện","Hỏi có xe buýt đến một nơi không; hỏi bến xa không.","这儿有到北京大学的公交车吗？有，但车站有点儿远。"],[2,"Chọn cách đi","Đề nghị đi xe buýt hoặc taxi và giải thích.","车站有点儿远，我们还是打车去吧。"],[2,"Giới thiệu trường","Nói trường lớn/đẹp, số sinh viên, có phòng học/rạp phim.","学校很漂亮，有四万多名学生，里边还有一家电影院。"],[2,"Chọn vé phim","Nói vé đắt hay rẻ, dùng định ngữ với 的.","他们卖的电影票很便宜。我们有时间再过来看个电影吧。"],[3,"Kết quả công việc","Hỏi đã làm xong bài tập/cơm chưa; trả lời và nói lý do.","你做完作业了吗？我还没做完。今天的作业太多了。"],[3,"Kế hoạch du lịch","Hỏi đã nghĩ xong đi đâu chưa và tại sao chọn nơi đó.","你想好去哪儿旅游了吗？我想去西安，因为这个时候去西安很不错。"],[3,"Mời ăn táo","Nói đã rửa xong táo, mời bạn tự lấy và rửa tay.","吃个苹果吧，我都洗好了。就在桌子上，你自己拿。我去洗洗手。"],[3,"Một ngày bận rộn","Kể đưa con đi học, trở về làm việc, mệt và muốn nghỉ.","早上我开车送孩子去学校。医院让我回去上班。我很累，想休息休息。"]],"builder":[["我 / 是 / 今天早上 / 到 / 的","我是今天早上到的"],["王老师 / 让 / 我们 / 说中文","王老师让我们说中文"],["我们 / 还是 / 打车去 / 吧","我们还是打车去吧"],["他们卖的 / 电影票 / 很便宜","他们卖的电影票很便宜"],["我 / 已经 / 到北京 / 了","我已经到北京了"],["我 / 还没 / 想好 / 呢","我还没想好呢"],["我 / 想 / 休息休息","我想休息休息"],["我 / 看了看 / 网上的介绍","我看了看网上的介绍"]],"quiz":[["你就是王老师的学生（　）？",["吧","完","次"],0,"吧表示揣测、确认：phỏng đoán, muốn xác nhận."],["Chọn câu nhấn mạnh function sentenceEdits(got,want){const a=[...got],b=[...want],m=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)m[i][0]=i;for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));let i=a.length,j=b.length,out=[];while(i||j){if(i&&j&&a[i-1]===b[j-1]){i--;j--;}else if(i&&j&&m[i][j]===m[i-1][j-1]+1){out.unshift(`Chữ ${j}: thay “${a[i-1]}” bằng “${b[j-1]}”`);i--;j--;}else if(j&&m[i][j]===m[i][j-1]+1){out.unshift(`Thiếu chữ “${b[j-1]}” ở vị trí ${j}`);j--;}else{out.unshift(`Thừa chữ “${a[i-1]}”`);i--;}}return out;}
function dictScore(){$('#dictationScore').textContent=`Đúng ${[...dictationResults.values()].filter(Boolean).length}/${dictation.length} câu · đã kiểm tra ${dictationResults.size} câu`;}
document.addEventListener('click',e=>{const check=e.target.closest('[data-checkdict]'),reset=e.target.closest('[data-resetdict]');if(check){const i=Number(check.dataset.checkdict),input=$('#dict'+i),got=normal(input.value),want=normal(dictation[i]);if(!got){$('#dictfb'+i).textContent='Hãy nghe và viết câu trước khi kiểm tra.';return;}const ok=got===want;dictationResults.set(i,ok);input.classList.toggle('correct',ok);input.classList.toggle('wrong',!ok);$('#dictfb'+i).innerHTML=ok?'✓ Đúng cả câu!':`<p>Chưa đúng. ${sentenceEdits(got,want).map(esc).join('<br>')}</p><div class="vocab-example">Câu đúng: ${cn(dictation[i])}</div>`;dictScore();}if(reset){let i=Number(reset.dataset.resetdict);$('#dict'+i).value='';$('#dict'+i).classList.remove('correct','wrong');$('#dictfb'+i).innerHTML='';dictationResults.delete(i);dictScore();}});
$$('[id^="dict"]').filter(e=>e.tagName==='INPUT').forEach(input=>input.addEventListener('input',()=>{let i=Number(input.id.slice(4));dictationResults.delete(i);input.classList.remove('correct','wrong');$('#dictfb'+i).innerHTML='';dictScore();}));dictScore();
