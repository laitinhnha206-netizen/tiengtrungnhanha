ia đình."],["因为只有艾玛一个老外，所以大家都在打量她。","Vì chỉ có Emma là người nước ngoài nên mọi người đều quan sát cô ấy."]]],[2,"如果 / 要是……就……","Đặt giả thiết; kết quả xảy ra khi giả thiết được đáp ứng.","如果 / 要是 + giả thiết，就 + kết quả",[["如果你有什么问题，就给我打电话。","Nếu có vấn đề gì thì gọi điện cho tôi."],["要是他不同意，我们就不能去了。","Nếu anh ấy không đồng ý thì chúng ta không thể đi."]]],[2,"只要……就……","Nêu điều kiện đủ. Khác với 只有……才……: điều kiện cần.","只要 + điều kiện，就 + kết quả",[["只要你说得对，我们就听你的。","Chỉ cần bạn nói đúng thì chúng tôi sẽ nghe bạn."],["只要不认真，就容易犯错。","Chỉ cần không cẩn thận thì dễ mắc lỗi."]]],[2,"先……再…… và ……才……","先……再…… chỉ thứ tự; 才 nhấn mạnh phải chờ đến một điều kiện hoặc thời điểm.","先 + việc 1，再 + việc 2 / điều kiện + 才 + hành động",[["艾玛先观察，再行动。","Emma quan sát trước rồi mới hành động."],["爷爷奶奶拿起茶杯，她才拿起自己的茶杯。","Ông bà nâng chén trà rồi cô ấy mới nâng chén của mình."]]],[3,"不但……而且 / 还……","Nối hai ý tăng tiến: không chỉ… mà còn…","Chủ ngữ + 不但 + A，而且 / 还 + B",[["广场舞不但能锻炼身体，还能让人交朋友。","Múa quảng trường không chỉ rèn luyện sức khỏe mà còn giúp kết bạn."]]],[3,"Vị trí của 不但","Cùng chủ ngữ: thường đặt chủ ngữ trước 不但. Hai chủ ngữ khác nhau: đặt 不但 trước chủ ngữ thứ nhất.","不但 + chủ ngữ 1 + A，而且 + chủ ngữ 2 + B",[["她不但喜欢跳舞，还喜欢编舞。","Cô ấy không chỉ thích nhảy mà còn thích biên đạo."],["不但艾玛觉得有意思，而且杰克也想试试。","Không chỉ Emma thấy thú vị mà Jack cũng muốn thử."]]],[3,"虽然……但是 / 可是……","Thừa nhận ý thứ nhất rồi nêu ý đối lập.","虽然 + A，但是 / 可是 + B",[["虽然广场舞很有意思，但是音乐太大会扰民。","Dù múa quảng trường thú vị nhưng nhạc quá to sẽ làm phiền cư dân."],["虽然杰克不跳舞，可是他观察得很细致。","Dù Jack không nhảy nhưng anh ấy quan sát rất tỉ mỉ."]]],[3,"Trình bày quan điểm có căn cứ","Phân biệt điều nhân vật quan sát và suy đoán của nhân vật. Không khẳng định mọi đàn ông đều ngại nhảy.","我觉得……因为…… / 有人认为……",[["有人觉得广场舞很有意思，也有人觉得它扰民。","Có người thấy thú vị; có người cho rằng làm phiền cư dân."],["他们猜想，有些男人可能比较害羞。","Họ đoán rằng một số đàn ông có thể khá ngại ngùng."]]]],"speak":[[1,"Kể tình huống của Jack","Kể vì sao Jack hít phải khói thuốc thụ động trên đường; dùng 因为、影响、二手烟.","有个人一直在杰克前面抽烟。那是一条小路，杰克只能跟在他后面，所以吸了不少二手烟。"],[1,"Giải thích một tỷ lệ","Tự đưa ví dụ số học sinh của lớp và tỷ lệ; đọc số lớn, phần trăm rõ ràng.","我们班有二十名学生，其中十二名是女生。女生占全班人数的百分之六十。"],[1,"Kể cách bà giúp ông bỏ thuốc","Tóm tắt ba cách trong bài: không hút trong nhà, để dành tiền, câu nói của bà.","奶奶不让爷爷在家里抽烟。只要爷爷抽一支烟，就要拿出一支烟的钱。最后爷爷真的戒烟了。"],[1,"Chủ đề ngày không thuốc lá","Giải thích ý nghĩa theo bài; nói bạn mong muốn điều gì ở nơi công cộng.","世界无烟日是每年的五月三十一日。我希望公共场所没有二手烟。"],[2,"Giới thiệu gia đình Emma đến thăm","Nêu sáu thành viên, tuổi hai em và nghề của bố mẹ.","这家有六口人：爷爷、奶奶、爸爸、妈妈、龙龙和梅梅。龙龙十一岁，梅梅五岁。爸爸是建筑工程师，妈妈是大学教师。"],[2,"Giải thích mục đích chuyến thăm","Dùng 因为……所以…… để nói về课题 và lựa chọn gia đình.","因为艾玛要完成一个课题，所以她想感受中国人的真实生活。她在网上联系了五个家庭，最后只选择了一个。"],[2,"Kể cách Emma cư xử","Nêu thứ tự uống trà và dùng đũa; dùng 先、再、才.","艾玛先观察，再行动。爷爷奶奶拿起茶杯，她才拿起自己的茶杯。大家拿起筷子，她才拿起筷子。"],[2,"Đóng vai chủ nhà và khách","Mỗi người nói ba lượt; dùng 如果、只要 và lời tiếp đón.","欢迎来我家做客！如果你有什么问题，就告诉我。谢谢！只要能和大家一起聊天，我就很开心。"],[3,"Tóm tắt bối cảnh bài đọc","Nêu thời gian, bốn người, quán trà và hoạt động ngoài quảng trường.","星期三晚上，李梅、赵亮、艾玛和杰克参加读书会后，在附近的茶馆儿聊天。外面的广场上有很多人在跳舞。"],[3,"Nêu lợi ích múa quảng trường","Dùng 不但……还……; thêm ví dụ theo bài.","广场舞不但能锻炼身体，还能丰富生活。大家一起聊天、交朋友，就不那么孤单了。"],[3,"Thảo luận tiếng nhạc","Một bạn ủng hộ, một bạn nêu lo ngại; dùng 虽然……但是…… và đề xuất thời gian.","虽然广场舞能让人放松，但是音乐太大会影响附近的人。我觉得应该安排好时间，也应该把声音调小。"],[3,"Phân biệt chi tiết và suy đoán","Nêu điều Jack quan sát; nói rõ ý kiến về đàn ông là suy đoán.","杰克发现跳舞的人大多是女性。他们猜想，有些男人可能害羞，也可能有不同的爱好。这只是他们的看法。"]],"builder":[["女生 / 占 / 全班人数的 / 百分之六十","女生占全班人数的百分之六十"],["因为时间有限 / 所以 / 她只选择了 / 一个家庭","因为时间有限所以她只选择了一个家庭"],["如果你有问题 / 就 / 给我 / 打电话","如果你有问题就给我打电话"],["只要你说得对 / 我们 / 就 / 听你的","只要你说得对我们就听你的"],["艾玛 / 先观察 / 再 / 行动","艾玛先观察再行动"],["广场舞 / 不但能锻炼身体 / 还能 / 丰富生活","广场舞不但能锻炼身体还能丰富生活"],["虽然杰克不跳舞 / 可是 / 他观察得 / 很细致","虽然杰克不跳舞可是他观察得很细致"],["音乐太大 / 会 / 影响 / 附近的人","音乐太大会影响附近的人"]], document.addEventListener('click',e=>{const b=e.target.closest('[data-group^="test"]');if(!b||graded)return;const group=b.dataset.group;testAnswers[Number(group.slice(4))]=b;$$(`[data-group="${group}"]`).forEach(z=>z.classList.toggle('selected',z===b));});
$('#submitTest').onclick=()=>{if(graded)return;if(!$('#studentName').value.trim()){$('#testScore').innerHTML='<p class="error">Nhập tên trước khi nộp bài.</p>';$('#studentName').focus();return;}graded=true;let readScore=0,listenScore=0;const details=[];const all=[...testQ,...D.listen.map(([s,q,o,a])=>[q,o,a,s])];all.forEach((q,i)=>{const b=testAnswers[i],ok=b?.dataset.correct==='true';if(ok){if(i<29)readScore++;else listenScore++;}$$(`[data-group="test${i}"]`).forEach(z=>{z.disabled=true;z.classList.toggle('correct',z.dataset.correct==='true');});if(b&&!ok)b.classList.add('wrong');$('#fb-test'+i).innerHTML=`${ok?'✓ Chính xác':b?'✗ Chưa đúng':'Chưa trả lời'}<div>${esc(q[3]||'')}</div>`;details.push({cau:i+1,de:q[0],traLoi:b?.dataset.val||'',dapAn:q[1][q[2]],dung:ok});});result={hocSinh:$('#studentName').value.trim(),bai:'Ôn Bài 1–3: không thuốc lá, gia đình, múa quảng trường',thoiGian:new Date().toISOString(),doc:readScore,nghe:listenScore,tong:readScore+listenScore,toida:35,chiTiet:details};$('#testScore').innerHTML=`<p class="score">${esc(result.hocSinh)} · ${result.tong}/35 điểm</p><p>Đọc, từ vựng & ngữ pháp: ${readScore}/29 · Nghe: ${listenScore}/6</p>`;$('#downloadResult').hidden=false;};
$('#downloadResult').onclick=()=>{if(!result)return;const rows=[`Học sinh: ${result.hocSinh}`,`Ôn tập Bài 1–3`,`Đọc: ${result.doc}/29 · Nghe: ${result.nghe}/6 · Tổng: ${result.tong}/35`,...result.chiTiet.map(x=>`${x.cau}. ${x.de}\nTrả lời: ${x.traLoi||'(chưa trả lời)'} · Đáp án: ${x.dapAn} · ${x.dung?'Đúng':'Sai'}`)];const a=document.createElement('a');const url=URL.createObjectURL(new Blob([rows.join('\n\n')],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='Ket_qua_Quyen_moi_Bai_1-3.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};

$('#writingContent').innerHTML=`<div class="card"><h3>Viết đúng từng chữ</h3><p>Chọn từ, nghe cách đọc rồi viết từng chữ bằng chuột hoặc ngón tay. Nét đúng được giữ lại; nét chưa đúng cần viết lại. Hoàn thành các chữ để kiểm tra cả từ.</p><label for="wordSelect">Từ cần luyện</label> <select id="wordSelect"></select><div id="wordPrompt" class="status"></div><div class="round"><button class="btn" id="startWriting">Viết & kiểm tra</button><button class="audio" id="writingAudio">🔊 Nghe từ</button><button class="ghost" id="showWritingModel">Xem mẫu nét</button><button class="ghost" id="rewriteWord">Viết lại cả từ</button><label><input type="checkbox" id="outlineHelp"> Hiện chữ mờ</label></div><p id="writeProgress"></p><div id="strokeWriter" class="stroke-box"></div><p id="writeFeedback" class="feedback" role="status"></p><button class="btn" id="nextWritingChar" hidden>Viết chữ tiếp theo</button><p id="wordResult" class="score" role="status"></p><p>Kiểm tra nét theo chữ được chọn: vị trí, hình dạng, hướng và thứ tự nét. Đây là phản hồi luyện tập, không phải nhận dạng chữ viết tự do.</p></div>`;
const writeWords=D.vocab.map(v=>({...v,h:v.h.replace(/[，。！？、]/g,'')})).filter((v,i,a)=>a.findIndex(z=>z.h===v.h)===i&&[...v.h].every(c=>STROKE_DATA[c]));
$('#wordSelect').innerHTML=writeWords.map((v,i)=>`<option value="${i}">${esc(v.h)} · ${esc(v.v)}</option>`).join('');
let writer=null,wordIndex=0,charIndex=0,wordMistakes=0,charMistakes={},writeSession=0;
function currentWord(){return writeWords[wordIndex];}
function writeStatus(t){$('#writeFeedback').textContent=t;}
function resetWord(){writeSession++;if(writer)writer.cancelQuiz();wordIndex=Number($('#wordSelect').value);charIndex=0;wordMistakes=0;charMistakes={};$('#wordPrompt').innerHTML=`<span class="py">${esc(currentWord().p)}</span><div>${esc(currentWord().v)}</div>`;$('#wordResult').textContent='';$('#nextWritingChar').hidden=true;loadWriteChar(false);}
function loadWriteChar(quiz){$('#wordResult').textContent='';delete charMistakes[charIndex];writeSession++;const token=writeSession;if(writer)writer.cancelQuiz();$('#strokeWriter').innerHTML='';const ch=[...currentWord().h][charIndex];writer=HanziWriter.create('strokeWriter',ch,{width:280,height:280,padding:18,showCharacter:false,showOutline:$('#outlineHelp').checked,strokeColor:'#172033',outlineColor:'#d9e2ef',highlightColor:'#2563eb',charDataLoader:(c,onLoad)=>onLoad(STROKE_DATA[c]),onLoadCharDataError:()=>writeStatus('Chưa tải được mẫu chữ. Hãy chọn lại từ.')});$('#writeProgress').textContent=`Chữ ${charIndex+1}/${[...currentWord().h].length} · ${STROKE_DATA[ch].strokes.length} nét`;$('#nextWritingChar').hidden=true;writeStatus('Nhấn “Viết & kiểm tra” để bắt đầu.');if(quiz)beginWriteQuiz(token);}
function beginWriteQuiz(token=writeSession){$('#nextWritingChar').hidden=true;writeStatus('Viết nét đầu tiên theo đúng thứ tự.');writer.quiz({leniency:1,showHintAfterMisses:2,acceptBackwardsStrokes:false,markStrokeCorrectAfterMisses:false,onMistake:d=>{if(token!==writeSession)return;writeStatus(`Nét ${d.strokeNum+1} chưa đúng. Viết lại; sau hai lần sai sẽ có gợi ý.`);},onCorrectStroke:d=>{if(token!==writeSession)return;writeStatus(`✓ Nét ${d.strokeNum+1} đúng · còn ${d.strokesRemaining} nét.`);},onComplete:d=>{if(token!==writeSession)return;charMistakes[charIndex]=d.totalMistakes;wordMistakes=Object.values(charMistakes).reduce((a,b)=>a+b,0);writeStatus(`✓ Đã viết đúng chữ ${d.character}. Số lần cần sửa: ${d.totalMistakes}.`);if(charIndex+1<[...currentWord().h].length){$('#nextWritingChar').hidden=false;}else{$('#wordResult').innerHTML=`✓ Hoàn thành từ ${cn(currentWord().h)}<div style="font-size:16px">${wordMistakes===0?'Đúng ngay từ lần đầu ở tất cả các nét.':`Đã sửa ${wordMistakes} lần để hoàn thành đúng các nét.`}</div>`;}}});}
$('#wordSelect').onchange=resetWord;$('#startWriting').onclick=()=>{loadWriteChar(true);};$('#rewriteWord').onclick=resetWord;$('#writingAudio').onclick=()=>say(currentWord().h);$('#showWritingModel').onclick=()=>{writeSession++;writer.cancelQuiz();$('#nextWritingChar').hidden=true;writeStatus('Quan sát thứ tự nét, rồi nhấn “Viết & kiểm tra” để tự viết.');writer.animateCharacter();};$('#outlineHelp').onchange=()=>{if($('#outlineHelp').checked)writer.showOutline();else writer.hideOutline();};$('#nextWritingChar').onclick=()=>{charIndex++;loadWriteChar(true);};resetWord();

function sentenceEdits(got,want){const a=[...got],b=[...want],m=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)m[i][0]=i;for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));let i=a.length,j=b.length,out=[];while(i||j){if(i&&j&&a[i-1]===b[j-1]){i--;j--;}else if(i&&j&&m[i][j]===m[i-1][j-1]+1){out.unshift(`Chữ ${j}: thay “${a[i-1]}” bằng “${b[j-1]}”`);i--;j--;}else if(j&&m[i][j]===m[i][j-1]+1){out.unshift(`Thiếu chữ “${b[j-1]}” ở vị trí ${j}`);j--;}else{out.unshift(`Thừa chữ “${a[i-1]}”`);i--;}}return out;}
