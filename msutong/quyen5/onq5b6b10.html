<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập Q5 – Bài 6 đến Bài 10</title>
<style>
:root {
  --bg:#f7f7fb; --card:#ffffff; --text:#25243a; --muted:#6f6d82;
  --primary:#6957d9; --primary2:#8d7cf0; --accent:#ffb84d; --good:#159b68; --bad:#d94d5c;
  --line:#e9e7f2; --shadow:0 12px 30px rgba(50,42,95,.09);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f6f3ff 0,#f8fafc 45%,#f7f7fb 100%);color:var(--text)}
header{padding:36px 20px 22px;text-align:center}
header h1{margin:0 0 8px;font-size:clamp(28px,5vw,46px)}
header p{margin:0;color:var(--muted)}
.container{width:min(1120px,94%);margin:auto;padding-bottom:60px}
.topbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);padding:14px;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:5}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit}
.tab,.btn{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;transition:.2s}
.tab{background:#f0eef9;color:#514a77;font-weight:700}
.tab.active{background:var(--primary);color:white;transform:translateY(-1px)}
.score{font-weight:700;color:var(--primary)}
.hero-card{margin-top:20px;background:linear-gradient(135deg,#6b58dc,#9c8cf4);color:white;border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.hero-card h2{margin:0 0 8px}
.section{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.section h3{margin-top:0;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.stat{background:#faf9ff;border:1px solid var(--line);border-radius:16px;padding:16px}
.grammar-box{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
@media(max-width:760px){.grammar-box{grid-template-columns:1fr}}
.formula{background:#f2efff;border-left:5px solid var(--primary);padding:14px;border-radius:12px;font-weight:700}
.example{padding:12px 0;border-bottom:1px dashed var(--line)}
.example:last-child{border-bottom:0}
.zh{font-size:19px;font-weight:700}
.vi{color:var(--muted);margin-top:4px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn{background:var(--primary);color:white;font-weight:700}
.btn.secondary{background:#eeeafd;color:var(--primary)}
.btn.accent{background:var(--accent);color:#4e3410}
.btn.good{background:var(--good)}
.flashcard{min-height:230px;border:2px dashed #cfc8f4;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;cursor:pointer;background:linear-gradient(135deg,#fff,#f7f5ff);user-select:none}
.flashcard .big{font-size:clamp(34px,7vw,58px);font-weight:800}
.flashcard .hint{color:var(--muted);margin-top:12px}
.progress{height:10px;background:#eceaf4;border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));width:0}
.quiz-card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.options{display:grid;gap:8px;margin-top:12px}
.option{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;cursor:pointer;text-align:left}
.option:hover{border-color:#b9b0ef}
.option.correct{background:#e9f8f2;border-color:#7bd1af}
.option.wrong{background:#fff0f1;border-color:#f09ca6}
.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:650px){.match-wrap{grid-template-columns:1fr}}
.match-col{display:grid;gap:9px}
.match-item{border:1px solid var(--line);padding:11px;border-radius:12px;background:#fff;cursor:pointer}
.match-item.selected{outline:3px solid #b8aff2}
.match-item.done{opacity:.45;text-decoration:line-through}
.fill-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
.grammar-task{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;background:#fff}
.grammar-task .task-type{font-size:12px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.5px}
.grammar-task .task-q{margin:8px 0 12px;font-size:17px}
.token-row{display:flex;gap:8px;flex-wrap:wrap}.token{border:1px solid var(--line);background:#f7f5ff;border-radius:10px;padding:8px 10px;cursor:pointer}.token.used{opacity:.4}.answer-zone{min-height:45px;border:2px dashed #cfc8f4;border-radius:12px;padding:8px;margin:10px 0;background:#fbfaff}
.feedback{font-weight:700;margin-top:8px}.explain{display:none;margin-top:8px;color:var(--muted);font-size:14px}.grammar-task.done .explain{display:block}
.fill-row input{min-width:100px;flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f0eefb;color:var(--primary);font-size:13px;font-weight:700}

.vocab-list{display:grid;gap:10px;margin-top:14px}
.vocab-item{display:grid;grid-template-columns:minmax(150px,.75fr) 1.6fr;gap:18px;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
.vocab-main .zh{font-size:22px}.vocab-main .vi{margin-top:3px}
.vocab-example{border-left:3px solid #d8d1fb;padding-left:14px}
.vocab-example .zh{font-size:17px}.example-vi{color:var(--muted);margin-top:4px}
@media(max-width:680px){.vocab-item{grid-template-columns:1fr;gap:10px}.vocab-example{border-left:0;border-top:1px dashed var(--line);padding:10px 0 0}}

.vocab-table{width:100%;border-collapse:collapse}
.vocab-table th,.vocab-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
.vocab-table th{position:sticky;top:80px;background:white}
.small{font-size:13px;color:var(--muted)}
.pinyin{font-size:14px;color:#8a819f;margin-top:4px;font-weight:500;letter-spacing:.2px}
body.hide-pinyin .pinyin{display:none!important}
.pinyin-toggle{background:#fff3d8;color:#6b4a00;border:1px solid #f4d590;font-weight:800}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>

const lessons = {"6": {"title": "Bài 6 – Giao tiếp & quà tặng", "grammar": {"name": "“就” và “才” – 6 cách dùng quan trọng", "theory": "<b>就1 – Rõ ràng, dễ nhận ra:</b> dùng để nhấn mạnh đúng là/chính là.<br><b>就2 – Số lượng nhiều hoặc mức độ mạnh:</b> nhấn mạnh hành động xảy ra nhiều, nhanh hoặc mạnh hơn dự kiến.<br><b>就3 – Sớm, nhanh, dễ:</b> thể hiện người nói cảm thấy sự việc xảy ra sớm, nhanh hoặc dễ.<br><br><b>才1 – Muộn, chậm, khó:</b> thể hiện sự việc xảy ra muộn hoặc không dễ dàng.<br><b>才2 – Vừa mới:</b> có thể mang nghĩa gần với 刚 / 刚刚 + V.<br><b>才3 – Ít, chỉ:</b> mang nghĩa gần với 只, nhấn mạnh số lượng hoặc thời gian ít.", "formula": "就 + Động từ / Cụm từ  |  才 + Động từ / Cụm từ", "examples": [["就1：你看，前面就是我家。", "Nhìn kìa, phía trước chính là nhà tôi.", "jiù yī: nǐ kàn, qián miàn jiù shì wǒ jiā."], ["就2：去年我就去过四个城市。", "Chỉ riêng năm ngoái tôi đã đi qua bốn thành phố.", "jiù èr: qù nián wǒ jiù qù guo sì ge chéng shì."], ["就3：我八点就到公司了。", "Tám giờ tôi đã đến công ty rồi.", "jiù sān: wǒ bā diǎn jiù dào gōng sī le."], ["才1：他昨天晚上十二点才回家。", "Tối qua đến mười hai giờ anh ấy mới về nhà.", "cái yī: tā zuó tiān wǎn shang shí èr diǎn cái huí jiā."], ["才2：今年的春节才过完，我就要上班了。", "Tết năm nay vừa mới kết thúc thì tôi đã phải đi làm rồi.", "cái èr: jīn nián de chūn jié cái guò wán, wǒ jiù yào shàng bān le."], ["才3：才学了半年，他的汉语就这么好了。", "Chỉ mới học nửa năm mà tiếng Trung của anh ấy đã giỏi như vậy.", "cái sān: cái xué le bàn nián, tā de hàn yǔ jiù zhè me hǎo le."]]}, "vocab": [["内行", "người am hiểu, người trong nghề", "nèi háng", "他对电脑很内行。", "Anh ấy rất am hiểu về máy tính."], ["专家", "chuyên gia", "zhuān jiā", "她是一位教育专家。", "Cô ấy là một chuyên gia giáo dục."], ["经验", "kinh nghiệm", "jīng yàn", "他有丰富的工作经验。", "Anh ấy có kinh nghiệm làm việc phong phú."], ["体现", "thể hiện, phản ánh", "tǐ xiàn", "这件事体现了他的责任心。", "Việc này thể hiện tinh thần trách nhiệm của anh ấy."], ["真诚", "chân thành", "zhēn chéng", "她真诚地感谢大家。", "Cô ấy chân thành cảm ơn mọi người."], ["行动", "hành động", "xíng dòng", let currentLesson = "6";

const $ = s => document.querySelector(s);
function shuffle(a) { return [...a].sort(()=>Math.random()-.5); }
function addScore(n) {
  score += n;
  localStorage.setItem("q5_score", score);
  $("#score").textContent = score;
}
function applyPinyinState() {
  document.body.classList.toggle("hide-pinyin", !showPinyin);
  const btn = document.querySelector("#pinyinToggle");
  if(btn) btn.textContent = showPinyin ? "Ẩn pinyin" : "Hiện pinyin";
}
function togglePinyin() {
  showPinyin = !showPinyin;
  localStorage.setItem("q5_show_pinyin", String(showPinyin));
  applyPinyinState();
}
function initTabs() {
  const tabs = $("#tabs");
  tabs.innerHTML = Object.keys(lessons).map(k => `<button class="tab ${k===currentLesson?'active':''}" onclick="switchLesson('${k}')">Bài ${k}</button>`).join("");
}
function switchLesson(k) {
  currentLesson = k; flashIndex=0; flashShowMeaning=false; quizAnswered=0; selectedLeft=null;
  initTabs(); renderLesson();
}
function renderLesson() {

    <div class="hero-card">
      <span class="badge">第${currentLesson}课</span>
      <h2>${L.title}</h2>
      <div>${L.vocab.length} từ vựng · 1 trọng điểm ngữ pháp · nhiều hoạt động ôn tập</div>
    </div>

    <section class="section">
      <h3>① Từ vựng cần nhớ</h3>

      <div class="controls">
        <input id="searchBox" oninput="filterVocab()" placeholder="Tìm chữ Hán, pinyin, nghĩa hoặc câu ví dụ..." style="flex:1;min-width:220px;padding:11px;border:1px solid var(--line);border-radius:12px">

    </section>

    <section class="section">

function renderFlash() {
  const v = lessons[currentLesson].vocab[flashIndex];
  $("#flashcard").innerHTML = flashShowMeaning
    ? `<div><div class="big">${v[1]}</div><div class="zh" style="margin-top:12px">${v[0]}</div><div class="pinyin">${v[2]||""}</div><div class="hint">Nhấn để lật</div></div>`
    : `<div><div class="big">${v[0]}</div><div class="pinyin" style="font-size:18px">${v[2]||""}</div><div class="hint">Đoán nghĩa rồi nhấn để lật</div></div>`;
  $("#flashProgress").style.width = ((flashIndex+1)/lessons[currentLesson].vocab.length*100)+"%";
}
function flipCard() { flashShowMeaning=!flashShowMeaning; renderFlash(); }
function nextCard() { flashIndex=(flashIndex+1)%lessons[currentLesson].vocab.length; flashShowMeaning=false; renderFlash(); }
function prevCard() { flashIndex=(flashIndex-1+lessons[currentLesson].vocab.length)%lessons[currentLesson].vocab.length; flashShowMeaning=false; renderFlash(); }
function randomCard() { flashIndex=Math.floor(Math.random()*lessons[currentLesson].vocab.length); flashShowMeaning=false; renderFlash(); }

function buildQuiz() {
  const vocab = lessons[currentLesson].vocab;
  const qs = shuffle(vocab).slice(0,8);
  $("#quiz").innerHTML = qs.map((item,idx)=>{
    const wrongs = shuffle(vocab.filter(x=>x[0]!==item[0])).slice(0,3).map(x=>x[1]);
    const opts = shuffle([item[1],...wrongs]);
    return `<div class="quiz-card">
      <div><b>Câu ${idx+1}.</b> “${item[0]}” có nghĩa là gì?<div class="pinyin">${item[2]||""}</div></div>
      <div class="options">${opts.map(o=>`<button class="option" onclick="answerQuiz(this,'${esc(o)}','${esc(item[1])}')">${o}</button>`).join("")}</div>
    </div>`;
  }).join("");
}
function esc(s) { return s.replaceAll("\\","\\\\").replaceAll("'","\\'"); }
function answerQuiz(btn, chosen, correct) {
  const box = btn.closest(".options");
  if(box.dataset.done) return;
  box.dataset.done="1";
  [...box.children].forEach(b=>{
    if(b.textContent===correct) b.classList.add("correct");
  });
  if(chosen===correct) { addScore(10); btn.classList.add("correct"); }
  else btn.classList.add("wrong");
}

function buildMatch() {
  selectedLeft=null;
  const set = shuffle(lessons[currentLesson].vocab).slice(0,6);
  const rights = shuffle(set);
  $("#matchGame").innerHTML = `<div class="match-wrap">
    <div class="match-col">${set.map((x,i)=>`<div class="match-item" data-id="${x[0]}" onclick="pickLeft(this)"><div class="zh">${x[0]}</div><div class="pinyin">${x[2]||""}</div></div>`).join("")}</div>
    <div class="match-col">${rights.map(x=>`<div class="match-item" data-id="${x[0]}" onclick="pickRight(this)">${x[1]}</div>`).join("")}</div>
  </div><div id="matchMsg" style="margin-top:12px;font-weight:700"></div>`;
}
function pickLeft(el) {
  if(el.classList.contains("done")) return;
  document.querySelectorAll("#matchGame .match-col:first-child .match-item").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected"); selectedLeft=el;
}
function pickRight(el) {
  if(!selectedLeft || el.classList.contains("done")) return;
  if(el.dataset.id===selectedLeft.dataset.id) {
    el.classList.add("done"); selectedLeft.classList.add("done"); selectedLeft.classList.remove("selected");
    $("#matchMsg").textContent="✅ Chính xác!"; addScore(5); selectedLeft=null;
  } else {
    $("#matchMsg").textContent="❌ Chưa đúng, thử lại nhé!";
  }
}

function buildGrammarGame(){
  const items=shuffle(smartGrammar[currentLesson]).slice(0,4);
  $("#grammarGame").innerHTML=items.map((x,i)=>{
    if(x.tokens){
      const tokens=shuffle(x.tokens);
      return `<div class="grammar-task" data-answer="${esc(x.a)}" data-display="${esc(x.display)}">
        <div class="task-type">${x.type}</div><div class="task-q">${i+1}. ${x.q}</div>
        <div class="token-row">${tokens.map(t=>`<button class="token" onclick="pickToken(this)">${t}</button>`).join("")}</div>
        <div class="answer-zone"></div>
        <button class="btn secondary" onclick="checkOrder(this)">Kiểm tra</button>
        <button class="btn secondary" onclick="resetOrder(this)">Làm lại</button>
        <div class="feedback"></div><div class="explain">💡 ${x.why}</div>
      </div>`;
    }
    return `<div class="grammar-task" data-answer="${esc(x.a)}">
      <div class="task-type">${x.type}</div><div class="task-q">${i+1}. ${x.q}</div>
      <div class="options">${x.options.map(o=>`<button class="option" onclick="answerGrammar(this,'${esc(o)}')">${o}</button>`).join("")}</div>
      <div class="feedback"></div><div class="explain">💡 ${x.why}</div>
    </div>`;
  }).join("");
}
function answerGrammar(btn,chosen){
  const task=btn.closest('.grammar-task'); if(task.classList.contains('done')) return;
  const correct=task.dataset.answer; task.classList.add('done');
  task.querySelectorAll('.option').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});
  if(chosen===correct){btn.classList.add('correct');task.querySelector('.feedback').textContent='✅ Chính xác!';addScore(8)}
  else{btn.classList.add('wrong');task.querySelector('.feedback').textContent='❌ Đáp án đúng: '+correct}
}
function pickToken(btn){
  if(btn.classList.contains('used'))return; btn.classList.add('used');
  const zone=btn.closest('.grammar-task').querySelector('.answer-zone');
  const chip=document.createElement('button'); chip.className='token'; chip.textContent=btn.textContent;
  chip.onclick=()=>{btn.classList.remove('used');chip.remove()}; zone.appendChild(chip);
}
function checkOrder(btn){
  const task=btn.closest('.grammar-task'); const made=[...task.querySelector('.answer-zone').children].map(x=>x.textContent).join('');
  const ok=made.replace(/[，。！？\s]/g,'')===task.dataset.answer.replace(/[，。！？\s]/g,''); task.classList.add('done');
  task.querySelector('.feedback').textContent=ok?'✅ Chính xác!':'❌ Đáp án: '+task.dataset.display;
  if(ok)addScore(10);
}
function resetOrder(btn){
  const task=btn.closest('.grammar-task');task.classList.remove('done');task.querySelector('.answer-zone').innerHTML='';task.querySelectorAll('.token.used').forEach(x=>x.classList.remove('used'));task.querySelector('.feedback').textContent='';
}
function renderVocab(list) {
  $("#vocabBody").innerHTML = list.map(x=>`<div class="vocab-item">
    <div class="vocab-main">
      <div class="zh">${x[0]}</div>
      <div class="pinyin">${x[2]||""}</div>
      <div class="vi">${x[1]}</div>
    </div>
    <div class="vocab-example">
      <div class="small">例句</div>
      <div class="zh">${x[3]||""}</div>
      <div class="example-vi">${x[4]||""}</div>
    </div>
  </div>`).join("");
}
function filterVocab() {
  const q=$("#searchBox").value.trim().toLowerCase();
  renderVocab(lessons[currentLesson].vocab.filter(x=>x.join(" ").toLowerCase().includes(q)));
}
