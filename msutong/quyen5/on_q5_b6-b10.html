<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập Q5 – Bài 6 đến Bài 10</title>
<style>
:root {
  --bg:#f7f7fb; --card:#ffffff; --text:#25243a; --muted:#6f6d82;
  --primary:#6957d9; --primary2:#8d7cf0; --accent:#ffb84d; --good:#159b68; --bad:#d94d5c;
  --line:#e9e7f2; --shadow:0 12px 30px rgba(50,42,95,.09);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f6f3ff 0,#f8fafc 45%,#f7f7fb 100%);color:var(--text)}
header{padding:36px 20px 22px;text-align:center}
header h1{margin:0 0 8px;font-size:clamp(28px,5vw,46px)}
header p{margin:0;color:var(--muted)}
.container{width:min(1120px,94%);margin:auto;padding-bottom:60px}
.topbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);padding:14px;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:5}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit}
.tab,.btn{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;transition:.2s}
.tab{background:#f0eef9;color:#514a77;font-weight:700}
.tab.active{background:var(--primary);color:white;transform:translateY(-1px)}
.score{font-weight:700;color:var(--primary)}
.hero-card{margin-top:20px;background:linear-gradient(135deg,#6b58dc,#9c8cf4);color:white;border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.hero-card h2{margin:0 0 8px}
.section{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.section h3{margin-top:0;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.stat{background:#faf9ff;border:1px solid var(--line);border-radius:16px;padding:16px}
.grammar-box{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
@media(max-width:760px){.grammar-box{grid-template-columns:1fr}}
.formula{background:#f2efff;border-left:5px solid var(--primary);padding:14px;border-radius:12px;font-weight:700}
.example{padding:12px 0;border-bottom:1px dashed var(--line)}
.example:last-child{border-bottom:0}
.zh{font-size:19px;font-weight:700}
.vi{color:var(--muted);margin-top:4px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn{background:var(--primary);color:white;font-weight:700}
.btn.secondary{background:#eeeafd;color:var(--primary)}
.btn.accent{background:var(--accent);color:#4e3410}
.btn.good{background:var(--good)}
.flashcard{min-height:230px;border:2px dashed #cfc8f4;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;cursor:pointer;background:linear-gradient(135deg,#fff,#f7f5ff);user-select:none}
.flashcard .big{font-size:clamp(34px,7vw,58px);font-weight:800}
.flashcard .hint{color:var(--muted);margin-top:12px}
.progress{height:10px;background:#eceaf4;border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));width:0}
.quiz-card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.options{display:grid;gap:8px;margin-top:12px}
.option{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;cursor:pointer;text-align:left}
.option:hover{border-color:#b9b0ef}
.option.correct{background:#e9f8f2;border-color:#7bd1af}
.option.wrong{background:#fff0f1;border-color:#f09ca6}
.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:650px){.match-wrap{grid-template-columns:1fr}}
.match-col{display:grid;gap:9px}
.match-item{border:1px solid var(--line);padding:11px;border-radius:12px;background:#fff;cursor:pointer}
.match-item.selected{outline:3px solid #b8aff2}
.match-item.done{opacity:.45;text-decoration:line-through}
.fill-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
.fill-row input{min-width:100px;flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f0eefb;color:var(--primary);font-size:13px;font-weight:700}
.vocab-table{width:100%;border-collapse:collapse}
.vocab-table th,.vocab-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
.vocab-table th{position:sticky;top:80px;background:white}
.small{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>
<header>
  <h1>复习 Q5：第6课–第10课</h1>
  <p>Ôn từ vựng và ngữ pháp theo từng bài – học ngắn, chơi nhiều, nhớ lâu.</p>
</header>
<div class="container">
  <div class="topbar">
    <div class="tabs" id="tabs"></div>
    <div class="score">⭐ Điểm: <span id="score">0</span></div>
  </div>

  <div id="lessonContent"></div>
</div>
<footer>Trang ôn tập độc lập – có thể mở trực tiếp trên điện thoại hoặc máy tính.</footer>

<script>
const lessons = {"6": {"title": "Bài 6 – Giao tiếp & quà tặng", "grammar": {"name": "\"就\" và \"才\"", "theory": "就 nhấn mạnh sớm, nhanh, dễ hoặc kết quả xảy ra ngay. 才 nhấn mạnh muộn, chậm, khó; đôi khi mang nghĩa “mới/chỉ mới”.", "formula": "就 + Động từ / Cụm từ  |  才 + Động từ / Cụm từ", "examples": [["你看，前面就是我家。", "Nhìn kìa, phía trước chính là nhà tôi."], ["马上就到我爸爸的生日了。", "Sắp đến sinh nhật bố tôi rồi."], ["才学了半年，他的汉语就这么好了。", "Mới học nửa năm mà tiếng Trung của anh ấy đã giỏi như vậy."]]}, "vocab": [["内行", "người am hiểu, người trong nghề"], ["专家", "chuyên gia"], ["经验", "kinh nghiệm"], ["体现", "thể hiện, phản ánh"], ["真诚", "chân thành"], ["行动", "hành động"], ["性格", "tính cách"], ["投其所好", "chiều theo sở thích của người khác"], ["思考", "suy nghĩ"], ["笔记", "ghi chép, ghi chú"], ["难题", "vấn đề khó"], ["人类", "loài người"], ["理想", "lý tưởng"], ["忍不住", "không nhịn được, không kìm được"], ["交流", "giao tiếp, trao đổi"], ["信息", "thông tin"], ["表达", "biểu đạt, thể hiện"], ["同事", "đồng nghiệp"], ["心意", "tấm lòng, thành ý"], ["礼轻情意重", "quà tuy nhẹ nhưng tình nghĩa sâu nặng"], ["农历", "âm lịch"], ["反而", "ngược lại, trái lại"], ["负担", "gánh nặng"]]}, "7": {"title": "Bài 7 – Nụ cười & sức khỏe", "grammar": {"name": "Cấu trúc chữ “的”", "theory": "Trong một số ngữ cảnh, danh từ phía sau 的 có thể được lược bỏ. Cấu trúc X + 的 vẫn mang nghĩa X + 的 + danh từ và có thể làm chủ ngữ hoặc tân ngữ.", "formula": "X + 的 (+ Danh từ)", "examples": [["白的是我的。", "Cái màu trắng là của tôi."], ["坐在前面的是谁？", "Người ngồi phía trước là ai?"], ["咱们先吃新鲜的。", "Chúng ta ăn đồ tươi trước."]]}, "vocab": [["月饼", "bánh trung thu"], ["粽子", "bánh ú, bánh zongzi"], ["年轻", "trẻ"], ["传染", "lây nhiễm"], ["演讲", "bài diễn thuyết, diễn thuyết"], ["题目", "đề bài, chủ đề"], ["隐藏", "che giấu, ẩn giấu"], ["力量", "sức mạnh"], ["超过", "vượt quá"], ["相当于", "tương đương với"], ["巧克力", "sô-cô-la"], ["英镑", "bảng Anh"], ["长寿", "trường thọ"], ["笑一笑十年少", "một nụ cười trẻ ra mười tuổi"], ["愁眉苦脸", "mặt ủ mày chau"], ["倾城", "nghiêng nước nghiêng thành, vô cùng xinh đẹp"], ["典故", "điển cố"], ["消失", "biến mất"], ["道理", "đạo lý, lẽ phải"], ["不管", "bất kể, dù cho"], ["小名", "tên gọi ở nhà"], ["优点", "ưu điểm"], ["作家", "nhà văn"], ["处理", "xử lý"], ["变化", "thay đổi"], ["笑容", "nụ cười"]]}, "8": {"title": "Bài 8 – Nhà hàng & gọi món", "grammar": {"name": "Động từ lặp lại（动词重叠）", "theory": "Động từ lặp lại diễn tả hành động ngắn, nhẹ, thử làm, đề nghị mềm mại hoặc hành động ngắn trong quá khứ.", "formula": "V一V / VV / V了V", "examples": [["你坐坐，我马上来。", "Bạn ngồi một lát nhé, tôi đến ngay."], ["让我来试一试吧。", "Để tôi thử xem."], ["她去医院查了查。", "Cô ấy đã đến bệnh viện kiểm tra một chút."]]}, "vocab": [["高级", "cao cấp"], ["面试", "phỏng vấn"], ["老板", "ông chủ"], ["老板娘", "bà chủ"], ["炒饭", "cơm chiên"], ["古老肉", "thịt heo chua ngọt"], ["叉烧肉", "thịt xá xíu"], ["凉菜", "món nguội"], ["素菜", "món chay"], ["素鸭", "vịt chay"], ["点菜", "gọi món"], ["担心", "lo lắng"], ["讲究", "coi trọng, chú trọng"], ["主食", "món chính, lương thực chính"], ["精致", "tinh xảo, tinh tế"], ["广东", "Quảng Đông"], ["好像", "hình như, giống như"], ["学问", "học vấn, kiến thức"], ["用餐", "dùng bữa"], ["浪费", "lãng phí"], ["荤菜", "món mặn, món có thịt"], ["口味", "khẩu vị"], ["搭配", "phối hợp, kết hợp"], ["咸", "mặn"]]}, "9": {"title": "Bài 9 – Làm quen & quan sát", "grammar": {"name": "Cấu trúc V₁ 着 V₂", "theory": "V₁ biểu thị trạng thái đi kèm với hành động V₂. Hai hành động xảy ra đồng thời, trong đó V₁ là trạng thái được duy trì.", "formula": "V₁ 着 + V₂", "examples": [["他笑着对我说。", "Anh ấy vừa cười vừa nói với tôi."], ["她唱着歌走出家门。", "Cô ấy vừa hát vừa đi ra khỏi nhà."], ["他背着照相机到外面走走。", "Anh ấy đeo máy ảnh ra ngoài đi dạo."]]}, "vocab": [["陌生", "xa lạ"], ["怪不得", "chẳng trách, thảo nào"], ["乖乖女", "cô gái ngoan"], ["窗", "cửa sổ"], ["友好", "thân thiện"], ["设计", "thiết kế"], ["话题", "chủ đề"], ["收获", "thu hoạch; điều thu được"], ["留", "giữ lại, ở lại"], ["京剧", "Kinh kịch"], ["难得", "hiếm có, khó có được"], ["胡子", "râu"], ["擅长", "giỏi, sở trường"], ["流利", "lưu loát"], ["纠正", "sửa lại, uốn nắn"], ["的确", "quả thật"], ["一回生二回熟", "lần đầu còn lạ, lần sau sẽ quen"], ["效果", "hiệu quả, tác dụng"], ["善于", "giỏi về"], ["观察", "quan sát"], ["眼神", "ánh mắt"], ["举止", "cử chỉ"], ["衣着", "cách ăn mặc, trang phục"], ["总之", "tóm lại"]]}, "10": {"title": "Bài 10 – Tuổi tác, thời gian & nghệ thuật", "grammar": {"name": "Câu chữ 比 có 得", "theory": "Dùng để so sánh mức độ giữa hai đối tượng. Khi kết quả so sánh được biểu thị bằng bổ ngữ có 得, ta dùng một trong hai cấu trúc dưới đây.", "formula": "A 比 B + V + 得 + Bổ ngữ  |  A + V + 得 + 比 B + Bổ ngữ", "examples": [["他比你唱得好听。", "Anh ấy hát hay hơn bạn."], ["汽车比自行车跑得快。", "Ô tô chạy nhanh hơn xe đạp."], ["我写得比他快。", "Tôi viết nhanh hơn anh ấy."]]}, "vocab": [["论文", "luận văn, bài nghiên cứu"], ["感觉", "cảm giác; cảm thấy"], ["难怪", "chẳng trách"], ["老成", "chín chắn, già dặn"], ["心态", "tâm thái, trạng thái tâm lý"], ["至少", "ít nhất"], ["条件", "điều kiện"], ["注重", "chú trọng"], ["质量", "chất lượng"], ["安排", "sắp xếp"], ["丰富", "phong phú"], ["继续", "tiếp tục"], ["老龄化", "già hóa dân số"], ["增长", "tăng trưởng"], ["表示", "biểu thị, cho biết"], ["古董", "đồ cổ"], ["想法", "ý tưởng, suy nghĩ"], ["时尚", "thời trang"], ["明显", "rõ ràng"], ["预测", "dự đoán"], ["分明", "rõ ràng, rành rành"], ["黄昏", "hoàng hôn"], ["夕阳", "mặt trời chiều, ánh chiều tà"], ["如果", "nếu"], ["意味着", "có nghĩa là"], ["无限", "vô hạn"], ["著名", "nổi tiếng"], ["何必", "hà tất, cần gì phải"], ["惆怅", "buồn bã, u sầu"], ["画展", "triển lãm tranh"]]}};
let currentLesson = "6";
let score = Number(localStorage.getItem("q5_score") || 0);
let flashIndex = 0;
let flashShowMeaning = false;
let quizAnswered = 0;
let selectedLeft = null;

const $ = s => document.querySelector(s);
function shuffle(a) { return [...a].sort(()=>Math.random()-.5); }
function addScore(n) {
  score += n;
  localStorage.setItem("q5_score", score);
  $("#score").textContent = score;
}
function initTabs() {
  const tabs = $("#tabs");
  tabs.innerHTML = Object.keys(lessons).map(k => `<button class="tab ${k===currentLesson?'active':''}" onclick="switchLesson('${k}')">Bài ${k}</button>`).join("");
}
function switchLesson(k) {
  currentLesson = k; flashIndex=0; flashShowMeaning=false; quizAnswered=0; selectedLeft=null;
  initTabs(); renderLesson();
}
function renderLesson() {
  const L = lessons[currentLesson];
  const examples = L.grammar.examples.map(e=>`<div class="example"><div class="zh">${e[0]}</div><div class="vi">${e[1]}</div></div>`).join("");
  $("#lessonContent").innerHTML = `
    <div class="hero-card">
      <span class="badge">第${currentLesson}课</span>
      <h2>${L.title}</h2>
      <div>${L.vocab.length} từ vựng · 1 trọng điểm ngữ pháp · 4 hoạt động ôn tập</div>
    </div>

    <section class="section">
      <h3>① Ngữ pháp trọng tâm</h3>
      <div class="grammar-box">
        <div>
          <h2>${L.grammar.name}</h2>
          <p>${L.grammar.theory}</p>
          <div class="formula">${L.grammar.formula}</div>
        </div>
        <div>${examples}</div>
      </div>
    </section>

    <section class="section">
      <h3>② Flashcard tốc độ</h3>
      <div class="progress"><div id="flashProgress"></div></div>
      <div class="controls">
        <button class="btn secondary" onclick="prevCard()">← Trước</button>
        <button class="btn" onclick="flipCard()">Lật thẻ</button>
        <button class="btn secondary" onclick="nextCard()">Sau →</button>
        <button class="btn accent" onclick="randomCard()">Ngẫu nhiên</button>
      </div>
      <div class="flashcard" onclick="flipCard()" id="flashcard"></div>
    </section>

    <section class="section">
      <h3>③ Trắc nghiệm “Chọn thật nhanh”</h3>
      <p class="small">Mỗi câu đúng được cộng 10 điểm.</p>
      <div id="quiz"></div>
      <button class="btn accent" onclick="buildQuiz()">Tạo bộ câu hỏi mới</button>
    </section>

    <section class="section">
      <h3>④ Trò chơi nối cặp</h3>
      <p class="small">Chọn một ô tiếng Trung rồi chọn nghĩa tiếng Việt tương ứng.</p>
      <div id="matchGame"></div>
      <button class="btn accent" onclick="buildMatch()">Đổi bộ từ</button>
    </section>

    <section class="section">
      <h3>⑤ Thử thách ngữ pháp</h3>
      <div id="grammarGame"></div>
    </section>

    <section class="section">
      <h3>⑥ Danh sách từ vựng đầy đủ</h3>
      <div class="controls">
        <input id="searchBox" oninput="filterVocab()" placeholder="Tìm chữ Hán hoặc nghĩa..." style="flex:1;min-width:220px;padding:11px;border:1px solid var(--line);border-radius:12px">
      </div>
      <div style="overflow:auto">
        <table class="vocab-table">
          <thead><tr><th>汉字</th><th>Nghĩa tiếng Việt</th></tr></thead>
          <tbody id="vocabBody"></tbody>
        </table>
      </div>
    </section>
  `;
  renderFlash();
  buildQuiz();
  buildMatch();
  buildGrammarGame();
  renderVocab(L.vocab);
}
function renderFlash() {
  const v = lessons[currentLesson].vocab[flashIndex];
  $("#flashcard").innerHTML = flashShowMeaning
    ? `<div><div class="big">${v[1]}</div><div class="hint">${v[0]} · nhấn để lật</div></div>`
    : `<div><div class="big">${v[0]}</div><div class="hint">Đoán nghĩa rồi nhấn để lật</div></div>`;
  $("#flashProgress").style.width = ((flashIndex+1)/lessons[currentLesson].vocab.length*100)+"%";
}
function flipCard() { flashShowMeaning=!flashShowMeaning; renderFlash(); }
function nextCard() { flashIndex=(flashIndex+1)%lessons[currentLesson].vocab.length; flashShowMeaning=false; renderFlash(); }
function prevCard() { flashIndex=(flashIndex-1+lessons[currentLesson].vocab.length)%lessons[currentLesson].vocab.length; flashShowMeaning=false; renderFlash(); }
function randomCard() { flashIndex=Math.floor(Math.random()*lessons[currentLesson].vocab.length); flashShowMeaning=false; renderFlash(); }

function buildQuiz() {
  const vocab = lessons[currentLesson].vocab;
  const qs = shuffle(vocab).slice(0,8);
  $("#quiz").innerHTML = qs.map((item,idx)=>{
    const wrongs = shuffle(vocab.filter(x=>x[0]!==item[0])).slice(0,3).map(x=>x[1]);
    const opts = shuffle([item[1],...wrongs]);
    return `<div class="quiz-card">
      <div><b>Câu ${idx+1}.</b> “${item[0]}” có nghĩa là gì?</div>
      <div class="options">${opts.map(o=>`<button class="option" onclick="answerQuiz(this,'${esc(o)}','${esc(item[1])}')">${o}</button>`).join("")}</div>
    </div>`;
  }).join("");
}
function esc(s) { return s.replaceAll("\\","\\\\").replaceAll("'","\\'"); }
function answerQuiz(btn, chosen, correct) {
  const box = btn.closest(".options");
  if(box.dataset.done) return;
  box.dataset.done="1";
  [...box.children].forEach(b=>{
    if(b.textContent===correct) b.classList.add("correct");
  });
  if(chosen===correct) { addScore(10); btn.classList.add("correct"); }
  else btn.classList.add("wrong");
}

function buildMatch() {
  selectedLeft=null;
  const set = shuffle(lessons[currentLesson].vocab).slice(0,6);
  const rights = shuffle(set);
  $("#matchGame").innerHTML = `<div class="match-wrap">
    <div class="match-col">${set.map((x,i)=>`<div class="match-item" data-id="${x[0]}" onclick="pickLeft(this)">${x[0]}</div>`).join("")}</div>
    <div class="match-col">${rights.map(x=>`<div class="match-item" data-id="${x[0]}" onclick="pickRight(this)">${x[1]}</div>`).join("")}</div>
  </div><div id="matchMsg" style="margin-top:12px;font-weight:700"></div>`;
}
function pickLeft(el) {
  if(el.classList.contains("done")) return;
  document.querySelectorAll("#matchGame .match-col:first-child .match-item").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected"); selectedLeft=el;
}
function pickRight(el) {
  if(!selectedLeft || el.classList.contains("done")) return;
  if(el.dataset.id===selectedLeft.dataset.id) {
    el.classList.add("done"); selectedLeft.classList.add("done"); selectedLeft.classList.remove("selected");
    $("#matchMsg").textContent="✅ Chính xác!"; addScore(5); selectedLeft=null;
  } else {
    $("#matchMsg").textContent="❌ Chưa đúng, thử lại nhé!";
  }
}

}
function checkFill(btn) {
  const row=btn.closest(".fill-row"), input=row.querySelector("input"), result=row.querySelector(".fill-result");
  if(input.value.trim()===input.dataset.answer) { result.textContent="✅"; addScore(5); input.disabled=true; btn.disabled=true; }
  else result.textContent="❌ Đáp án: "+input.dataset.answer;
}
function renderVocab(list) {
  $("#vocabBody").innerHTML = list.map(x=>`<tr><td class="zh">${x[0]}</td><td>${x[1]}</td></tr>`).join("");
}
function filterVocab() {
  const q=$("#searchBox").value.trim().toLowerCase();
  renderVocab(lessons[currentLesson].vocab.filter(x=>x.join(" ").toLowerCase().includes(q)));
}
